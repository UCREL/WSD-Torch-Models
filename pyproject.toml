[project]
name = "wsd-torch-models"
version = "0.1.1"
description = "Word Sense Disambiguation models that have been converted from PyTorch Lightning to PyTorch with HuggingFace Hub Mixin"
readme = "README.md"
authors = [
    { name = "UCREL Research Centre", email = "ucrel@lancaster.ac.uk" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10, <3.15"
dependencies = [
    "huggingface-hub<2.0",
    "numpy>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "safetensors>=0.4.3,<1.0",
    "torch>=2.2,<3.0",
    "transformers>=4.54.0,<5.0",
    "typing-extensions>=4.0,<5.0",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage[toml]>=6.0.0",
    "flake8>=3.8",
    "isort>=6.0",
    "mypy>=1.12",
    "pytest>=6.0,!=7.1.0,!=8.1.0",
    "types-pyyaml>=6.0,<7.0",
]

[tool.isort]
known_first_party = "wsd_torch_models"
known_third_party = [
    "huggingface-hub",
    "numpy",
    "pyyaml",
    "safetensors",
    "torch",
    "transformers",
    "typing-extensions",
    "pytest",
]
force_sort_within_sections = true
multi_line_output = 3
use_parentheses = true
force_grid_wrap = 0
include_trailing_comma = true
lines_after_imports = 2
line_length = 119


[tool.mypy]
files = ["tests/", "src/"]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
allow_untyped_globals = false
allow_redefinition = false
local_partial_types = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests"
]

[tool.coverage.run]
branch = true
source = [
    "src"
]
command_line = "-m pytest"

[tool.coverage.report]
show_missing = true

[tool.coverage.json]
output = "coverage.json"

[tool.coverage.xml]
output = "coverage.xml"
