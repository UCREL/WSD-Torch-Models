[project]
name = "wsd-torch-models"
version = "0.1.2"
description = "Word Sense Disambiguation models that have been converted from PyTorch Lightning to PyTorch with HuggingFace Hub Mixin"
readme = "README.md"
authors = [
    { name = "UCREL Research Centre", email = "ucrel@lancaster.ac.uk" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10, <3.15"
dependencies = [
    "huggingface-hub<2.0",
    "numpy>=1.19.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "safetensors>=0.4.3,<1.0",
    "torch>=2.2,<3.0",
    "transformers>=4.54.0,<5.0",
    "typing-extensions>=4.0,<5.0",
]

[project.optional-dependencies]
benchmark = [
    "datasets>=4.8.4",
    "psutil>=7.2.2",
    "typer>=0.24.2",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage[toml]>=6.0.0",
    "ruff>=0.14.13",
    "ty>=0.0.13",
    "pytest>=6.0,!=7.1.0,!=8.1.0",
    "types-pyyaml>=6.0,<7.0",
]
cpu   = ["torch>=2.2,<3.0"]
cu130 = ["torch>=2.2,<3.0"]
cu128 = ["torch>=2.2,<3.0"]
cu126 = ["torch>=2.2,<3.0"]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [
  [
    { group = "cpu" },
    { group = "cu130" },
    { group = "cu128" },
    { group = "cu126" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu",  group = "cpu"   },
  { index = "pytorch-cu130", group = "cu130" },
  { index = "pytorch-cu128", group = "cu128" },
  { index = "pytorch-cu126", group = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url  = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url  = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url  = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url  = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests"
]

[tool.coverage.run]
branch = true
source = [
    "src"
]
command_line = "-m pytest"

[tool.coverage.report]
show_missing = true
